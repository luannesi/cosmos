[pytest]
testpaths = tests
pythonpath = .
markers =
    chaos: AT (Acceptance Test) da especificação CHAOS §30
    order: AT (Acceptance Test) da especificação ORDER §44
    at(spec, num): amarra o teste ao AT numerado da spec
    needs_remote: exige um remoto Git (hosting)
    needs_two_executors: exige duas identidades de executor distintas
addopts = -ra --strict-markers
